<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JBL 9.4.6 全景声影院｜手机端</title>
<style>
html,body{margin:0;height:100%;background:#0b0e12;color:#dce6ec;font-family:Arial,"Microsoft YaHei",sans-serif}
#loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
small{display:block;margin-top:10px;color:#8fa0ae}
</style>
</head>
<body>
<div id="loading">正在加载 JBL 9.4.6 全景声影院…<small>首次打开需要载入完整 3D 场景</small></div>
<script>
(async function(){
 const parts=["part01.txt","part02.txt","part03.txt","part04.txt","part05.txt","part06.txt","part07.txt","part08.txt","part09.txt","part10.txt","part11.txt","part12.txt"];
 try{
   const rs=await Promise.all(parts.map(p=>fetch(p+"?v=20261005-mobile-v1",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(p+" "+r.status);return r.text()})));
   const html=rs.join("\n")+"\n";
   document.open();
   document.write(html);
   document.close();
 }catch(e){
   document.getElementById("loading").innerHTML="页面加载失败<br><small>"+String(e)+"</small>";
 }
})();
</script>
</body>
</html>
